name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev tooling
        run: python -m pip install --upgrade pip pytest ruff curl_cffi

      - name: Guard against committed secrets (.env)
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git — remove it and add to .gitignore"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)' ; then
            echo "::error::an .env file is tracked by git"
            exit 1
          fi
          echo "no .env tracked — ok"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests (pytest)
        env:
          PYTHONPATH: src
        run: pytest -q
